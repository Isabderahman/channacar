; ChannaCar PHP runtime overrides (copied to /usr/local/etc/php/conf.d/ in the image).
;
; The stock php:8.2-fpm defaults are upload_max_filesize=2M / post_max_size=8M.
; Car photos from a phone or DSLR are routinely 3-12 MB, so PHP silently dropped
; them from $_FILES and Laravel's `required|image` rule answered with a 422
; ("The image failed to upload.") that looked like a validation bug. Keep these
; above the app-level rule in CarImageController (max:51200 = 50 MB) and below
; nginx's client_max_body_size.
upload_max_filesize = 50M
post_max_size = 56M

; A 50 MB JPEG decodes to a much larger GD bitmap; the controller caps pixel
; count as well, but give the WebP re-encode real headroom.
memory_limit = 512M
max_execution_time = 120
